:none}.social a:hover{text-decoration:underline}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@media(max-width:580px){.top{padding-top:12px}.hero{padding-top:15px}.logo{width:230px}.nav{gap:9px}.nav button{min-width:0;flex:1;padding:13px 9px;font-size:12px}.content{padding-left:20px;padding-right:20px;min-height:330px}.cow-footer{height:110px}}
</style></head><body><main class="page"><header><div class="top"><nav class="langs" aria-label="Language"><button data-lang="it" class="active" aria-pressed="true">IT</button><span>|</span><button data-lang="es" aria-pressed="false">ES</button><span>|</span><button data-lang="en" aria-pressed="false">EN</button></nav></div><div class="hero"><img class="logo" src="logo.png" alt="La Manza Lola – Desde 2025"><p class="tagline" id="tagline"></p><nav class="nav" aria-label="Sections"><button data-tab="about" class="active"></button><button data-tab="catalog"></button><button data-tab="location"></button></nav></div></header><div class="content"><section class="pane active" id="about"><h1 id="about-title"></h1><div id="about-content"></div></section><section class="pane" id="catalog"><h1 id="catalog-title"></h1><p id="catalog-description"></p><div class="actions"><a id="catalog-link" class="action" href="catalogo-es.pdf" target="_blank" rel="noopener"></a><p id="catalog-note" class="subtle"></p></div></section><section class="pane" id="location"><h1 id="location-title"></h1><p class="address">Calle Cristo Viene, Bayahibe<br>La Altagracia, República Dominicana</p><div class="actions"><a id="map-link" class="action" target="_blank" rel="noopener" href="https://www.google.com/maps/place/La+Manza+Lola/data=!4m2!3m1!1s0x0:0x9f83025e5d23f687?sa=X&amp;ved=1t:2428&amp;ictx=111"></a></div></section></div><footer><div class="cow-footer" aria-hidden="true"><svg viewBox="0 0 1000 155" preserveAspectRatio="none"><path fill="#c5a98a" d="M-30 40 C70 -20 95 60 35 100 C-10 140 45 170 85 155 L-30 155Z M135 155 C150 95 210 95 243 116 C283 140 280 154 334 155Z M500 155 C540 102 601 104 623 136 C644 167 700 155 700 155Z M810 155 C830 103 874 90 912 121 C946 152 969 151 1030 95 L1030 155Z"/></svg></div><div class="social"><a href="https://www.instagram.com/lamanzalola/" target="_blank" rel="noopener">@lamanzalola</a> &nbsp;·&nbsp; <a href="mailto:lamanzalola@gmail.com">lamanzalola@gmail.com</a></div></footer></main><script>
const words={it:{tagline:'Una selezione esclusiva di carni, per portare il meglio sulla tua tavola.',about:'Chi siamo',catalog:'Catalogo',location:'Dove siamo',catalogDescription:'Scopri la nostra selezione di carni e i tagli disponibili.',catalogButton:'Visualizza il catalogo',catalogNote:'Il catalogo è attualmente disponibile in spagnolo. Le versioni italiana e inglese saranno aggiunte prossimamente.',map:'Apri su Google Maps',paragraphs:[`<strong>La Manza Lola</strong> nasce dalla passione per la carne di qualità e dall’impegno di offrire ai propri clienti una selezione esclusiva di prodotti, anche di importazione, destinati sia alla vendita all’ingrosso che al dettaglio.`,`Proponiamo un’ampia varietà di carni bovine, suine e avicole, dai tagli più tradizionali alle selezioni più pregiate, con la possibilità di personalizzare ogni taglio in base alle esigenze del cliente.`,`Tra le nostre specialità si distinguono le <strong>salsicce di produzione propria e gli hamburger di Angus</strong>, preparati con particolare attenzione alla qualità delle materie prime, per garantire freschezza e un sapore autentico.`,`Ci rivolgiamo a privati, ristoranti e professionisti del settore, offrendo un servizio attento e una selezione di prodotti pensata per soddisfare ogni esigenza.`,`<strong>La Manza Lola: qualità, passione e tradizione in ogni taglio.</strong>`]},es:{tagline:'Una selección exclusiva de carnes, para llevar lo mejor a tu mesa.',about:'Sobre nosotros',catalog:'Catálogo',location:'Dónde estamos',catalogDescription:'Descubre nuestra selección de carnes y cortes disponibles.',catalogButton:'Ver el catálogo',catalogNote:'Catálogo disponible en español.',map:'Abrir en Google Maps',paragraphs:[`<strong>La Manza Lola</strong> nace de la pasión por la carne de calidad y del compromiso de ofrecer a sus clientes una selección exclusiva de productos, también importados, tanto al por mayor como al detalle.`,`Ofrecemos una amplia variedad de carnes de res, cerdo y pollo, desde cortes tradicionales hasta selecciones premium, con la posibilidad de personalizar cada corte según las necesidades del cliente.`,`Entre nuestras especialidades destacan los <strong>embutidos de elaboración propia y las hamburguesas de carne Angus</strong>, preparados con especial atención a la calidad de la materia prima para ofrecer frescura y un sabor auténtico.`,`Atendemos a particulares, restaurantes y profesionales del sector, con un servicio cercano y una selección de productos pensada para cada necesidad.`,`<strong>La Manza Lola: calidad, pasión y tradición en cada corte.</strong>`]},en:{tagline:'An exclusive selection of meats, bringing the very best to your table.',about:'About us',catalog:'Catalog',location:'Find us',catalogDescription:'Discover our selection of meats and available cuts.',catalogButton:'View catalog',catalogNote:'The catalog is currently available in Spanish. English and Italian versions are coming soon.',map:'Open Google Maps',paragraphs:[`<strong>La Manza Lola</strong> was born from a passion for quality meat and a commitment to offering customers an exclusive selection of products, including imported meats, for both wholesale and retail.`,`We offer a wide variety of beef, pork and poultry, from traditional cuts to premium selections, with custom cuts tailored to each customer’s needs.`,`Our specialties include <strong>our own house-made sausages and Angus beef burgers</strong>, carefully prepared with a focus on high-quality ingredients, freshness and authentic flavor.`,`We serve individual customers, restaurants and food-service professionals, with attentive service and products selected to meet a wide range of needs.`,`<strong>La Manza Lola: quality, passion and tradition in every cut.</strong>`]}};
let lang='it';let tab='about';function render(){const t=words[lang];document.documentElement.lang=lang;document.getElementById('tagline').textContent=t.tagline;document.querySelector('[data-tab="about"]').textContent=t.about;document.querySelector('[data-tab="catalog"]').textContent=t.catalog;document.querySelector('[data-tab="location"]').textContent=t.location;document.getElementById('about-title').textContent=t.about;document.getElementById('about-content').innerHTML=t.paragraphs.map(x=>'<p>'+x+'</p>').join('');document.getElementById('catalog-title').textContent=t.catalog;document.getElementById('catalog-description').textContent=t.catalogDescription;document.getElementById('catalog-link').textContent=t.catalogButton;document.getElementById('catalog-note').textContent=t.catalogNote;document.getElementById('location-title').textContent=t.location;document.getElementById('map-link').textContent=t.map;document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',b.dataset.lang===lang?'true':'false')});document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===tab))}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();document.querySelector('.content').scrollIntoView({behavior:'smooth',block:'start'})});render();
</script></body></html>
