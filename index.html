/* La Manza Lola — beige caldo, serif elegante, bottoni stile Lumea */
:root {--base:#f2e7d7;--sand:#d7bea3;--ink:#6b4c37;--line:#c4a88b}
body{background:var(--base);color:var(--ink);font-family:'Baskerville','Palatino Linotype','Book Antiqua',Georgia,serif}
.langs,.langs button{font-family:Georgia,serif;color:var(--ink)}
.logo{width:clamp(195px,35vw,295px);height:auto;min-height:190px;object-fit:contain;filter:none;opacity:1;margin:5px auto 23px}
.tagline{color:#654a38;font-weight:400;letter-spacing:.1px}
.nav{max-width:590px;gap:13px;margin-top:36px}
.nav button{background:#e1cdb8;color:#62432e;border:1.3px solid #c5aa8d;border-radius:18px;min-height:77px;padding:19px 25px;font-family:'Baskerville','Palatino Linotype',Georgia,serif;font-size:22px;letter-spacing:.2px;box-shadow:none}
.nav button:after{color:#74533b;font-size:30px;font-family:Georgia,serif}
.nav button.active,.nav button:hover{background:#d7bea3;outline:0;filter:none}
.pane{background:#ead9c6;border:1px solid #d6bfa6;color:var(--ink)}
.pane h1,.pane p{color:var(--ink)}
.action{background:#d7bea3;color:#60442f;border:1px solid #c0a283;border-radius:17px;text-align:center;max-width:460px;font-family:'Baskerville','Palatino Linotype',Georgia,serif;font-size:20px}
.social{background:#f2e7d7;padding:18px 14px 26px}
.social a{background:#e1cdb8;color:#62432e;border:1px solid #c5aa8d;border-radius:18px;font:18px 'Baskerville','Palatino Linotype',Georgia,serif;min-width:140px;text-align:center}
.social a:hover,.action:hover{background:#d7bea3;filter:none}
.cow-footer{height:205px;background:#f2e7d7;overflow:hidden}
.cow-footer svg{display:block;width:100%;height:100%}
@media(max-width:580px){.hero{padding-left:22px;padding-right:22px}.logo{width:230px;min-height:220px;margin-bottom:22px}.nav{gap:11px}.nav button{font-size:20px;min-height:72px;padding:18px 22px}.cow-footer{height:155px}}

/* Modifiche richieste: logo leggibile, slogan raffinato, muccato integrato, contatti sopra le macchie */
:root{--base:#f2e7d7;--ink:#70503d;--sand:#e2cbb2}
body{background:var(--base);color:var(--ink)}
.hero .logo{width:clamp(210px,37vw,300px);min-height:0;display:block;opacity:1;visibility:visible;margin:12px auto 28px;filter:none}
.tagline{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:clamp(16px,2.3vw,21px);font-weight:400;line-height:1.7;letter-spacing:.2px;color:#765744;max-width:525px}
.nav button{background:#e4cfb8;color:#654734}
.nav button:hover,.nav button.active{background:#d8bfa5}
.pane{background:#ecddcb}
footer{background:transparent;padding:0;margin:0}
.social{position:relative;z-index:1;background:transparent;padding:14px 14px 19px;gap:14px}
.social a{background:#e4cfb8;color:#654734}
.cow-footer{height:225px;background:transparent;margin-top:-1px;pointer-events:none}
.cow-footer svg{display:block;width:100%;height:100%}
@media(max-width:580px){.hero .logo{width:235px;margin:10px auto 26px}.cow-footer{height:160px}.tagline{font-size:17px}}

const words={it:{tagline:'Una selezione esclusiva di carni, per portare il meglio sulla tua tavola.',about:'Chi siamo',gallery:'Galleria',galleryMessage:'Le fotografie della nostra selezione saranno disponibili prossimamente.',catalog:'Catalogo',delivery:'Delivery',deliveryDescription:'La qualità di La Manza Lola direttamente a casa tua. Scegli i tuoi tagli preferiti dal catalogo e contattaci su WhatsApp per organizzare il tuo ordine e la consegna.',deliveryButton:'Ordina su WhatsApp',location:'Dove siamo',catalogDescription:'Scopri la nostra selezione di carni e i tagli disponibili.',catalogButton:'Visualizza il catalogo',catalogNote:'Il catalogo è attualmente disponibile in spagnolo. Le versioni italiana e inglese saranno aggiunte prossimamente.',map:'Apri su Google Maps',paragraphs:[`<strong>La Manza Lola</strong> nasce dalla passione per la carne di qualità e dall’impegno di offrire ai propri clienti una selezione esclusiva di prodotti, anche di importazione, destinati sia alla vendita all’ingrosso che al dettaglio.`,`Proponiamo un’ampia varietà di carni bovine, suine e avicole, dai tagli più tradizionali alle selezioni più pregiate, con la possibilità di personalizzare ogni taglio in base alle esigenze del cliente.`,`Tra le nostre specialità si distinguono le <strong>salsicce di produzione propria e gli hamburger di Angus</strong>, preparati con particolare attenzione alla qualità delle materie prime, per garantire freschezza e un sapore autentico.`,`Ci rivolgiamo a privati, ristoranti e professionisti del settore, offrendo un servizio attento e una selezione di prodotti pensata per soddisfare ogni esigenza.`,`<strong>La Manza Lola: qualità, passione e tradizione in ogni taglio.</strong>`]},es:{tagline:'Una selección exclusiva de carnes, para llevar lo mejor a tu mesa.',about:'Sobre nosotros',gallery:'Galería',galleryMessage:'Próximamente podrás descubrir las fotografías de nuestra selección.',catalog:'Catálogo',delivery:'Delivery',deliveryDescription:'La calidad de La Manza Lola directamente a tu puerta. Elige tus cortes favoritos del catálogo y escríbenos por WhatsApp para coordinar tu pedido y la entrega.',deliveryButton:'Pedir por WhatsApp',location:'Dónde estamos',catalogDescription:'Descubre nuestra selección de carnes y cortes disponibles.',catalogButton:'Ver el catálogo',catalogNote:'Catálogo disponible en español.',map:'Abrir en Google Maps',paragraphs:[`<strong>La Manza Lola</strong> nace de la pasión por la carne de calidad y del compromiso de ofrecer a sus clientes una selección exclusiva de productos, también importados, tanto al por mayor como al detalle.`,`Ofrecemos una amplia variedad de carnes de res, cerdo y pollo, desde cortes tradicionales hasta selecciones premium, con la posibilidad de personalizar cada corte según las necesidades del cliente.`,`Entre nuestras especialidades destacan los <strong>embutidos de elaboración propia y las hamburguesas de carne Angus</strong>, preparados con especial atención a la calidad de la materia prima para ofrecer frescura y un sabor auténtico.`,`Atendemos a particulares, restaurantes y profesionales del sector, con un servicio cercano y una selección de productos pensada para cada necesidad.`,`<strong>La Manza Lola: calidad, pasión y tradición en cada corte.</strong>`]},en:{tagline:'An exclusive selection of meats, bringing the very best to your table.',about:'About us',gallery:'Gallery',galleryMessage:'Photos of our selection are coming soon.',catalog:'Catalog',delivery:'Delivery',deliveryDescription:'La Manza Lola quality delivered to your door. Choose your favorite cuts from our catalog and contact us on WhatsApp to arrange your order and delivery.',deliveryButton:'Order via WhatsApp',location:'Find us',catalogDescription:'Discover our selection of meats and available cuts.',catalogButton:'View catalog',catalogNote:'The catalog is currently available in Spanish. English and Italian versions are coming soon.',map:'Open Google Maps',paragraphs:[`<strong>La Manza Lola</strong> was born from a passion for quality meat and a commitment to offering customers an exclusive selection of products, including imported meats, for both wholesale and retail.`,`We offer a wide variety of beef, pork and poultry, from traditional cuts to premium selections, with custom cuts tailored to each customer’s needs.`,`Our specialties include <strong>our own house-made sausages and Angus beef burgers</strong>, carefully prepared with a focus on high-quality ingredients, freshness and authentic flavor.`,`We serve individual customers, restaurants and food-service professionals, with attentive service and products selected to meet a wide range of needs.`,`<strong>La Manza Lola: quality, passion and tradition in every cut.</strong>`]}};
